<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway - Login / Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        .hero-img { width: 100%; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a202c; margin-bottom: 25px; font-weight: 700; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 5px; font-weight: 600; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; outline: none; transition: 0.3s; box-sizing: border-box; font-size: 14px;}
        .input-group input:focus, .input-group select:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2); }
        
        .btn { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; position: relative;}
        .btn:hover { background: #2b6cb0; }
        .btn-outline { background: transparent; color: #3182ce; border: 1px solid #3182ce; margin-top: 10px; }
        .btn-outline:hover { background: #ebf8ff; }
        
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .toggle-text { margin-top: 20px; font-size: 14px; color: #718096; }
        .toggle-text span { color: #3182ce; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Payments" class="hero-img">
    
    <div id="loginForm" class="step active">
        <h2>Welcome to Gateway</h2>
        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="logEmail" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="logPassword" placeholder="Enter password">
        </div>
        <button class="btn" onclick="login()">
            <span id="logBtnText">Login Securely</span>
            <div class="spinner" id="logSpinner"></div>
        </button>
        <p class="toggle-text">Don't have an account? <span onclick="switchForm('signup1')">Create Account</span></p>
    </div>

    <div id="signup1" class="step">
        <h2>Create Account (1/3)</h2>
        <div class="input-group">
            <label>Username (For API)</label>
            <input type="text" id="regUser" placeholder="Choose username">
        </div>
        <div class="input-group">
            <label>Email ID</label>
            <input type="email" id="regEmail" placeholder="Enter email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="Create password">
        </div>
        <div class="input-group">
            <label>Re-enter Password</label>
            <input type="password" id="regRePass" placeholder="Confirm password">
        </div>
        <button class="btn" onclick="nextStep(1)">Next Step</button>
        <p class="toggle-text">Already have an account? <span onclick="switchForm('loginForm')">Login</span></p>
    </div>

    <div id="signup2" class="step">
        <h2>Select Platform (2/3)</h2>
        <div class="input-group">
            <label>Where will you use this API?</label>
            <select id="regPlatform">
                <option value="APP/WEBSITE">App & Website Both</option>
                <option value="ONLY APP">Only App</option>
                <option value="ONLY WEBSITE">Only Website</option>
            </select>
        </div>
        <button class="btn" onclick="nextStep(2)">Next Step</button>
        <button class="btn btn-outline" onclick="switchForm('signup1')">Back</button>
    </div>

    <div id="signup3" class="step">
        <h2>Personal Details (3/3)</h2>
        <div class="input-group">
            <label>Gender</label>
            <select id="regGender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="input-group">
            <label>Date of Birth</label>
            <input type="date" id="regDob">
        </div>
        <button class="btn" onclick="register()">
            <span id="regBtnText">Create Account</span>
            <div class="spinner" id="regSpinner"></div>
        </button>
        <button class="btn btn-outline" onclick="switchForm('signup2')">Back</button>
    </div>
</div>

<script>
    function switchForm(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function nextStep(current) {
        if(current === 1) {
            let u = document.getElementById('regUser').value;
            let p1 = document.getElementById('regPass').value;
            let p2 = document.getElementById('regRePass').value;
            if(!u || !p1) { Swal.fire('Error', 'Fill all fields', 'error'); return; }
            if(p1 !== p2) { Swal.fire('Error', 'Passwords do not match', 'error'); return; }
            switchForm('signup2');
        } else if (current === 2) {
            switchForm('signup3');
        }
    }

    function login() {
        let email = document.getElementById('logEmail').value;
        let pass = document.getElementById('logPassword').value;
        if(!email || !pass) { Swal.fire('Error', 'Fill all fields', 'error'); return; }
        
        document.getElementById('logBtnText').style.display = 'none';
        document.getElementById('logSpinner').style.display = 'block';

        fetch('/api/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'login', email: email, password: pass})
        }).then(r=>r.json()).then(data => {
            if(data.status === 'success') { window.location.href = '/dashboard'; }
            else { 
                Swal.fire('Error', data.message, 'error'); 
                document.getElementById('logBtnText').style.display = 'block';
                document.getElementById('logSpinner').style.display = 'none';
            }
        });
    }

    function register() {
        let u = document.getElementById('regUser').value;
        let e = document.getElementById('regEmail').value;
        let p = document.getElementById('regPass').value;
        let plat = document.getElementById('regPlatform').value;
        let gen = document.getElementById('regGender').value;
        let dob = document.getElementById('regDob').value;

        if(!dob) { Swal.fire('Error', 'Please select Date of Birth', 'error'); return; }

        document.getElementById('regBtnText').style.display = 'none';
        document.getElementById('regSpinner').style.display = 'block';

        fetch('/api/auth', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                action: 'register', username: u, email: e, password: p, 
                platform: plat, gender: gen, dob: dob
            })
        }).then(r=>r.json()).then(data => {
            document.getElementById('regBtnText').style.display = 'block';
            document.getElementById('regSpinner').style.display = 'none';
            if(data.status === 'success') {
                Swal.fire('Success', data.message, 'success').then(() => { switchForm('loginForm'); });
            } else {
                Swal.fire('Error', data.message, 'error');
            }
        });
    }
</script>
</body>
</html>
